[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# the app is run as scripts under src/ (python src/main.py), not imported as a package;
# installing the project just resolves the dependency set (single source of truth for Docker).
py-modules = []

[project]
name = "odrive-gui"
version = "0.2.0"
description = "A web-based GUI to tune and debug the ODrive motor controller"
readme = "README.md"
requires-python = ">=3.10"  # NiceGUI 3.x requires >=3.10
license = { text = "MIT" }
dependencies = [
    "nicegui>=3.0",
    "odrive>=0.6.2",
    "matplotlib>=3.7.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.19",  # pinned: single source of truth for the lint/format gate that CI runs
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/zauberzeug/odrive-gui"

[tool.ruff]
# 150 matches the repo's established autopep8 convention (see .vscode/settings.json).
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "Q"]
# E731: the per-mode send_* one-liner lambdas read clearly inline next to their buttons.
ignore = ["E731"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
# Check against the advertised floor (requires-python >= 3.10) so 3.11/3.12-only stdlib
# usage is caught here — ruff's py310 target only catches 3.11+ *syntax*, not new stdlib APIs.
python_version = "3.10"
mypy_path = "src"
# the GUI talks to a live `fibre` remote object whose attributes are resolved at
# runtime, so the device side is intentionally dynamically typed.
ignore_missing_imports = true
check_untyped_defs = true

# numpy is only a transitive dependency (matplotlib, via ui.line_plot); src never imports it.
# Its installed stub uses a 3.12 `type` statement mypy can't parse under python_version 3.10,
# so skip following it rather than raise the whole project's floor for a stub we don't use.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tools"]
testpaths = ["tests"]
# the NiceGUI `user` fixture (re)imports this module per test to register the page.
main_file = "tests/app_under_test.py"
