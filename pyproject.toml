[project]
name = "odrive-gui"
version = "0.1.0"
description = "A web-based GUI to tweak and debug the ODrive motor controller"
readme = "README.md"
requires-python = ">=3.9"  # src uses PEP 585 builtin generics (dict[int, ...]) as runtime annotations
license = { text = "MIT" }
dependencies = [
    "nicegui>=1.3.13",
    "odrive>=0.6.2",
    "matplotlib>=3.7.2",
]

[project.urls]
Homepage = "https://github.com/zauberzeug/odrive-gui"

[tool.uv]
# the app runs as scripts under src/ (python src/main.py); uv only manages the
# dependency set, it does not build/install this project as a package.
package = false
